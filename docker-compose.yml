version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: upay_ai_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite:///./database/upay_platform.db
      - ENVIRONMENT=production
    volumes:
      - ./database:/app/database
      - ./ai_models:/app/ai_models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: upay_ai_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
